<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wrong Answers Only</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Caveat:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&family=Oswald:wght@700&display=swap">
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* A graded exam sheet on a desk. Red pen marks the good (wrong) stuff; a stop-sign octagon ends each round. */
:root{
  --desk:#e9ece4; --paper:#fffef8; --grid:#dfe6ef; --ink:#1d2433; --muted:#5d6678;
  --red:#d7263d; --red-soft:#fbe3e6; --blue:#2c4fb8; --blue-soft:#e3e9fb; --line:#cfd6e2; --ok:#1f8a5b; --gold:#c98a00;
  --hi:#ffe45c; --hi-ink:#3b3000;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Caveat","Comic Sans MS","Bradley Hand",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --desk:#14181f; --paper:#1d2330; --grid:#262e3d; --ink:#eef1f6; --muted:#9aa4b6;
  --red:#ff5a6e; --red-soft:#3a1f27; --blue:#8aa6ff; --blue-soft:#232d48; --line:#323b4d; --ok:#4fd29a; --gold:#f2b632;
  --hi:#e8cf45; --hi-ink:#231c00; color-scheme:dark}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-inline:16px;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(130px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:20px}
h1,h2,h3{margin:0;font-weight:400}
h1{font-family:var(--display);font-size:clamp(2.2rem,7vw,4rem);line-height:.95;letter-spacing:.01em}
h1 span{display:inline-block}
h1 .w{transform:rotate(-3deg);color:var(--red);position:relative}
h1 .w::after{content:"";position:absolute;left:-4%;right:-4%;top:52%;height:.09em;background:var(--ink);transform:rotate(4deg);border-radius:4px}
h1 .o{transform:rotate(2deg) translateY(.06em)}
h2{font-family:var(--display);font-size:1.25rem;letter-spacing:.02em}
.tag{font-family:var(--hand);font-size:1.6rem;color:var(--blue);transform:rotate(-1.5deg);margin:6px 0 0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}

.sheet{background:var(--paper);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 1px 0 var(--line),0 10px 24px -14px rgba(0,0,0,.35);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% 30px;position:relative;min-width:0}
.margin{padding:20px 20px 22px 52px}
.margin::before{content:"";position:absolute;left:34px;top:0;bottom:0;width:2px;background:var(--red);opacity:.5}
.pad{padding:20px}
.stack{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:780px){.split{grid-template-columns:1fr}}

label{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted);display:grid;gap:4px}
input[type=text],select{font:inherit;font-size:1rem;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:9px 10px;min-width:0;width:100%}
input[type=text]:focus,select:focus{border-color:var(--blue);outline:none}
.codeinput{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display)!important;max-width:10rem;flex:1}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:6px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);padding:9px 14px;transition:transform .1s,background .15s;touch-action:manipulation}
button:hover:not(:disabled){transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.primary{background:var(--red);border-color:var(--red);color:#fff}
.blue{background:var(--blue);border-color:var(--blue);color:var(--paper)}
.ghost{border-color:var(--line);background:transparent}
.mini{padding:4px 10px;font-size:.85rem}

/* examples */
.ex{display:grid;gap:8px;padding:12px 0;border-bottom:1px dashed var(--line)}
.ex:last-child{border-bottom:0}
.ex .ptxt{font-weight:700;font-size:1.05rem}
.marks{display:flex;flex-wrap:wrap;gap:6px 18px}
.mark{font-family:var(--hand);font-size:1.45rem;line-height:1.1;color:var(--blue)}
.mark b{font-family:var(--body);font-size:.9rem;margin-right:4px}
.mark.y b{color:var(--ok)} .mark.n b{color:var(--red)}
.mark.n{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.notice{padding:12px 14px;border:1.5px solid var(--red);border-radius:6px;background:var(--red-soft);color:var(--ink);font-size:.92rem}

/* room header */
.topbar{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between}
.topbar .left{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.letter{width:68px;height:68px;border-radius:10px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--display);font-size:2.4rem;transform:rotate(-4deg);flex:none;box-shadow:3px 3px 0 var(--red)}
.letter.empty{background:var(--grid);color:var(--muted);box-shadow:none}
.meta{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.roomcode{font-family:var(--display);font-size:1.5rem;letter-spacing:.2em}
.conn{display:flex;gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
.conn .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.conn.off .dot{background:var(--red)}
.players{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.chip{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:.9rem;max-width:100%}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:12ch}
.chip.me{border-color:var(--blue)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.chip.off{opacity:.5}.chip.off .dot{background:var(--muted)}
.chip .sc{font-family:var(--display);font-variant-numeric:tabular-nums}
.chip .st{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip .st.done{color:var(--ok)}
.crown{color:var(--gold);font-size:.8rem}

/* share box */
.share{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:520px){.share{grid-template-columns:1fr;justify-items:center;text-align:center}}
.qr{background:#fff;padding:10px;border-radius:8px;width:max-content;max-width:100%}
.qr img,.qr canvas{display:block;width:150px;height:150px;max-width:100%}
.bigcode{font-family:var(--display);font-size:2.6rem;letter-spacing:.2em;color:var(--red);line-height:1}
.link{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}

/* prompts */
.prompts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.pcard{padding:16px 18px 18px 46px;display:grid;gap:8px;align-content:start}
.pcard::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:2px;background:var(--red);opacity:.5}
.pnum{position:absolute;left:8px;top:14px;font-family:var(--display);color:var(--red);font-size:1rem}
.cat{justify-self:start;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;padding:2px 8px;border-radius:3px;background:var(--ink);color:var(--paper)}
.ptext{font-family:var(--display);font-size:1.15rem;line-height:1.2;text-wrap:balance}
.rule{font-size:.88rem;font-weight:600;padding:4px 8px;border-radius:4px;justify-self:start}
.rule.plain{background:var(--red-soft);color:var(--red)}
.rule.cond{background:var(--blue-soft);color:var(--blue)}
.ansin{font-family:var(--hand)!important;font-size:1.65rem!important;color:var(--blue)!important;background:transparent!important;border:0!important;border-bottom:2px dashed var(--muted)!important;border-radius:0!important;padding:2px 4px!important}
.ansin:focus{border-bottom-color:var(--blue)!important}
.ansin.dup{color:var(--red)!important;border-bottom:2px solid var(--red)!important}

/* sticky bar */
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line);z-index:5}
.bar .in{max-width:1080px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.timer{flex:1 1 200px;display:flex;align-items:center;gap:10px;min-width:0}
.track{flex:1;height:10px;border-radius:999px;background:var(--grid);border:1px solid var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--blue);transform-origin:left;transition:transform .25s linear}
.track.low i{background:var(--red)}
.secs{font-variant-numeric:tabular-nums;font-weight:700;min-width:4ch;text-align:right}
.oct{clip-path:polygon(29.3% 0,70.7% 0,100% 29.3%,100% 70.7%,70.7% 100%,29.3% 100%,0 70.7%,0 29.3%)}
.stop{width:84px;height:84px;margin-top:-40px;border:0;border-radius:0;background:var(--red);color:#fff;font-family:var(--display);font-size:1.25rem;letter-spacing:.04em;display:grid;place-items:center;padding:0;flex:none;
  box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 7px var(--red)}
.stop:disabled{opacity:.35}

/* overlays */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--desk) 88%,transparent);display:grid;place-items:center;z-index:20;padding:16px}
.bigstop{width:min(70vw,260px);aspect-ratio:1;max-width:100%;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:clamp(2.5rem,12vw,4.5rem);
  box-shadow:inset 0 0 0 8px #fff,inset 0 0 0 14px var(--red);animation:slam .45s cubic-bezier(.2,1.6,.4,1);margin:0 auto}
.overlay .cap{text-align:center;display:grid;gap:6px;margin-top:16px}
.overlay .cap .h{font-family:var(--hand);font-size:2rem;color:var(--ink)}
@keyframes slam{from{transform:scale(2.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.popcard{background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:24px 22px;max-width:420px;width:100%;display:grid;gap:12px;text-align:center;
  box-shadow:6px 6px 0 var(--red);animation:wobble .5s cubic-bezier(.2,1.6,.4,1)}
.popcard .big{font-family:var(--display);font-size:clamp(1.4rem,5vw,1.8rem);line-height:1.1;text-wrap:balance}
.popcard .big s{color:var(--red);text-decoration-thickness:3px}
.popcard .h{font-family:var(--hand);font-size:1.5rem;color:var(--blue);overflow-wrap:anywhere}
@keyframes wobble{0%{transform:scale(.6) rotate(-8deg);opacity:0}60%{transform:scale(1.04) rotate(2deg);opacity:1}100%{transform:none}}

/* voting / results */
.vlist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.vlist li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.vlist li>div:first-child{flex:1 1 150px;min-width:0} /* the answer keeps whole words; buttons drop below when space runs out */
.vlist li:last-child{border-bottom:0}
.atext{font-family:var(--hand);font-size:1.55rem;line-height:1.1;color:var(--blue);overflow-wrap:anywhere}
.atext.out{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.who{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.vctl{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tog{padding:5px 10px;font-size:.85rem;border-color:var(--line);background:transparent}
.tog.okay{border-color:var(--ok);color:var(--ok)}
.tog.bad{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.tog.star[aria-pressed="true"]{border-color:var(--gold);color:var(--paper);background:var(--gold)}
.stamp{font-family:var(--display);font-size:.75rem;letter-spacing:.05em;padding:3px 7px;border:2.5px solid currentColor;border-radius:4px;transform:rotate(-5deg);white-space:nowrap}
.stamp.ok{color:var(--ok)}.stamp.out{color:var(--red)}.stamp.top{color:var(--gold)}
.pts{font-family:var(--display);font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.empty{color:var(--muted);font-size:.95rem}
.board{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.board li{display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-radius:6px;background:var(--paper);border:1.5px solid var(--line)}
.board li.first{border-color:var(--gold)}
.place{font-family:var(--display);font-size:1.2rem;color:var(--muted)}
.board li.first .place{color:var(--gold)}
.board .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .sc{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.best{display:grid;gap:4px;padding:14px 16px;border:2.5px dashed var(--gold);border-radius:8px}
.best .atext{font-size:2rem}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.center{text-align:center;justify-items:center}

/* ---------- playful layer ---------- */
button:hover:not(:disabled){transform:translateY(-1px) rotate(-1.2deg)}
.primary:hover:not(:disabled){box-shadow:3px 3px 0 var(--ink)}
.sticker{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:50%;border:3px solid var(--red);color:var(--red);
  font-family:var(--display);font-size:.72rem;line-height:1.05;text-align:center;transform:rotate(14deg);padding:6px;flex:none;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(8deg) translateY(-4px)}}
.hero{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dice{padding:0 10px;font-size:1.1rem;flex:none}
.nickrow{display:flex;gap:8px}
.namepick{max-width:560px;width:100%;margin:4vh auto 0}
.namepick #nick{font-family:var(--hand);font-size:1.7rem;color:var(--blue);padding:4px 10px}
.nameerr{min-height:1.4em;color:var(--red);font-weight:600;font-size:.92rem}
.ansnote{color:var(--red);font-weight:600;font-size:.85rem;min-height:0}
/* the pillory: smashes on public display */
.pillory{border:2px dashed var(--red);border-radius:6px;padding:6px 12px 8px;background:repeating-linear-gradient(-45deg,transparent 0 10px,var(--red-soft) 10px 20px);transform:rotate(-.6deg)}
.pillhead{font-family:var(--display);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.shamed .atext{color:var(--red);font-family:var(--display);font-size:1.4rem;line-height:1.15;letter-spacing:.03em;text-decoration:underline wavy;text-decoration-thickness:2px;text-underline-offset:5px;overflow-wrap:anywhere;padding-bottom:8px}
.tog.bell{border-color:var(--red);color:var(--red)}
.tog.bell[aria-pressed="true"]{background:var(--red);color:#fff;animation:ring .5s}
@keyframes ring{20%{transform:rotate(-14deg)}40%{transform:rotate(11deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(3deg)}}
.stamp.shame{color:var(--red)}
.pillory.hall{padding:12px 16px;display:grid;gap:4px;transform:rotate(-1deg)}
.pillory.hall .atext{color:var(--red);font-family:var(--display);font-size:2.2rem;line-height:1.1;text-decoration:underline wavy;text-decoration-thickness:3px;text-underline-offset:7px;overflow-wrap:anywhere;padding-bottom:10px}
.ansnote:empty{display:none}
.pcard{transform:rotate(var(--tilt,0deg))}
.ptop{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.ccount{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);border:1.5px dashed var(--blue);border-radius:999px;padding:1px 8px}
.ccount.zero{color:var(--red);border-color:var(--red)}
.ccount.monster{color:#fff;background:var(--red);border:1.5px solid var(--red);animation:jitter .25s steps(2) infinite}
@keyframes jitter{50%{transform:rotate(-3deg) translateX(1px)}}
mark{background:linear-gradient(100deg,transparent 2%,var(--hi) 4%,var(--hi) 96%,transparent 98%);color:var(--hi-ink);padding:0 .15em;border-radius:3px}
.conds{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-weight:600;font-size:.95rem}
.conds li{display:grid;grid-template-columns:1.1em minmax(0,1fr);gap:8px;align-items:baseline}
.conds.many{grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));column-gap:14px;font-size:.88rem}
.conds li::before{content:"";width:.85em;height:.85em;border:2px solid var(--muted);border-radius:3px;transform:translateY(.12em) rotate(-4deg)}
.pcard.deal{opacity:0;transform:translate(60px,-120px) rotate(18deg) scale(.85);pointer-events:none}
.pcard.dealt{animation:dealIn .55s cubic-bezier(.2,1.5,.45,1) both}
@keyframes dealIn{from{opacity:0;transform:translate(60px,-120px) rotate(18deg) scale(.85)}to{opacity:1;transform:rotate(var(--tilt,0deg))}}
.letter.spin{animation:shimmy .07s linear infinite}
@keyframes shimmy{50%{transform:rotate(4deg) scale(1.05)}}
.letter.land{animation:landing .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes landing{from{transform:scale(1.6) rotate(-20deg)}to{transform:rotate(-4deg)}}
.stamping .stamp{animation:thunk .35s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d,0ms)}
@keyframes thunk{from{opacity:0;transform:scale(2.4) rotate(-18deg)}to{opacity:1;transform:rotate(-5deg)}}
/* the STOP cinematic: its own dark movie-theater world in both themes */
.cinema{background:#06070b;padding:0;display:block;overflow:hidden;z-index:25}
.cine{position:absolute;inset:0;width:100%;height:100%;display:block}
.lb{position:absolute;left:0;right:0;height:0;background:#000;z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;animation:lbIn .4s cubic-bezier(.3,0,.2,1) forwards}
.lb.top{top:0}.lb.bot{bottom:0}
@keyframes lbIn{to{height:9vh}}
.cinema.out{opacity:0;transition:opacity .45s ease}
.lb.bot{gap:12px;padding-inline:16px;justify-content:space-between}
.roll{flex:1;min-width:0;overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.roll span{display:inline-block;padding-left:100%;font:600 .68rem/1.2 var(--body);letter-spacing:.22em;text-transform:uppercase;color:#9aa0b0;animation:roll 16s linear 4.2s forwards}
@keyframes roll{to{transform:translateX(-100%)}}
.skip{flex:none;background:transparent;border:1px solid #3a3f4c;color:#c9cdd8;font-size:.78rem;padding:4px 10px;border-radius:4px;max-width:55vw}
.skip:hover:not(:disabled){transform:none;border-color:#c9cdd8}
.cinecap{position:absolute;left:16px;right:16px;bottom:calc(9vh + 14px);text-align:center;z-index:3;display:grid;gap:2px;pointer-events:none}
.cinecap .h{font-family:var(--hand);font-size:clamp(1.8rem,6vw,2.7rem);line-height:1.1;color:#fff;opacity:0;text-shadow:0 2px 14px #000,0 0 2px #000;animation:fadeUp .5s 7.1s forwards}
.cinecap .sub{color:#d3d7e2;font-weight:600;opacity:0;text-shadow:0 1px 8px #000;animation:fadeUp .5s 7.5s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.winner{font-family:var(--hand);font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.05;color:var(--red);transform:rotate(-2deg)}
.winner b{font-family:var(--display);font-weight:400;color:var(--ink);font-size:.8em}
.ansin::placeholder{color:var(--muted);opacity:.65}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.pcard.deal{opacity:1;transform:none;pointer-events:auto}
  .lb{height:9vh}.cinecap .h,.cinecap .sub{opacity:1}.roll span{padding-left:0}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="overlay" id="dupPop" hidden role="dialog" aria-modal="true" aria-labelledby="dupTitle">

 {n:"Fruit",a:"a fruit",sub:["a tropical fruit","a citrus fruit","a dried fruit"],p:["from Asia","with fuzzy skin"],c:["is red","grows on trees","is smaller than a golf ball"]},
 {n:"Animal",a:"an animal",sub:["a farm animal","a sea animal","a jungle animal"],p:["with stripes","from Australia","with no legs"],c:["can fly","is a mammal","weighs less than a cat","lives in the ocean"]},
 {n:"Country",a:"a country",sub:["a European country","an island country"],p:["in Europe","in the Southern Hemisphere","with red on its flag"],c:["is landlocked","has more than 50 million people","has hosted the Olympics"]},
 {n:"Food",a:"a food",sub:["a breakfast food","a dessert","a fast food"],p:["from Italy","with cheese in it"],c:["is spicy","is eaten with chopsticks","is served cold","is deep fried"]},
 {n:"Job",a:"a job",sub:["a medical job","an office job"],p:["with a uniform","in a hospital"],c:["is done outdoors","needs a college degree","is done at night"]},
 {n:"Movie",a:"a movie",sub:["a superhero movie","a horror movie","an animated movie","a Christmas movie"],p:["about a superhero","about a dog","about space","with a talking animal"],c:["came out before 2000","won Best Picture","has a sequel"]},
 {n:"Vegetable",a:"a vegetable",sub:["a leafy vegetable","a root vegetable"],p:["with a strong smell"],c:["is green","grows underground","is usually eaten raw","is orange"]},
 {n:"Sport",a:"a sport",sub:["a winter sport","a water sport","a team sport"],p:["with a ball","with a racket"],c:["is in the Summer Olympics","is played on ice","is played in teams"]},
 {n:"City",a:"a city",sub:["a capital city","a beach city"],p:["in Asia","in the United States","on the coast"],c:["is a capital","has more than a million people"]},
 {n:"Body part",a:"a body part",sub:["a body part on your face"],p:["with a bone in it"],c:["you have two of","is above the neck","you can see right now"]},
 {n:"Kitchen",a:"something in a kitchen",sub:["a kitchen appliance","a cooking utensil"],p:["made of metal","with a plug"],c:["is sharp","fits in a drawer"]},
 {n:"Drink",a:"a drink",sub:["a hot drink","a cocktail","a soft drink"],p:["with bubbles","made from fruit"],c:["has alcohol in it","is served hot"]},
 {n:"Instrument",a:"a musical instrument",sub:["a string instrument","a brass instrument"],p:["with strings","with keys"],c:["you blow into","is in an orchestra","is smaller than a backpack"]},
 {n:"Furniture",a:"a piece of furniture",sub:["a piece of office furniture","a piece of garden furniture"],p:["with legs","with drawers"],c:["you can sleep on","usually lives in a bedroom"]},
 {n:"First name",a:"a first name",sub:["a boy's name","a girl's name","a dog's name"],p:["from the Bible"],c:["is popular in Spain","sounds old-fashioned"]},
 {n:"Clothing",a:"a piece of clothing",sub:["a piece of winter clothing","a piece of swimwear"],p:["with buttons","for your feet"],c:["gets worn at weddings","is usually black"]},
 {n:"Vehicle",a:"a vehicle",sub:["a flying vehicle","an emergency vehicle"],p:["with two wheels","on rails"],c:["seats more than ten people","is faster than a horse"]},
 {n:"Hobby",a:"a hobby",sub:["an outdoor hobby","an expensive hobby"],p:[],c:["is done alone","needs special equipment","is quiet"]},
 {n:"Bird",a:"a bird",sub:["a bird of prey","a pet bird"],p:["with a long beak"],c:["can't fly","lives near water","is bigger than a chicken","is mostly black"]},
 {n:"Toy",a:"a toy",sub:["a board game","a baby toy"],p:["with batteries","with more than 100 pieces"],c:["is for babies","you play with outside"]}
];
var LETTERS="ABCDEFGHIJLMNOPRSTUVW".split("");
var ANS=5, VOTE_SECS=120, STOP_PAUSE=9300, ONLINE_MS=16000; // STOP_PAUSE leaves room for the stop-sign trailer

/* ================= utils ================= */
function $(s){return document.querySelector(s)}

function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
var LS={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ---- conditions: 0 to 10 per prompt. 0 = plain prompt (don't name one). ---- */
var MAX_CONDS=20;
var VIBES=["would survive a zombie apocalypse","your grandma has heard of","fits in a shoebox","sounds completely made up","would make a good name for a dog",
  "is sold at a gas station","could beat a goose in a fight","is cooler than it sounds","a pirate would want","you'd bring to a sleepover",
  "is suspiciously shiny","would win a staring contest","you could hear from space","a toddler could spell","smells a little weird","is famous in Canada",
  "your dentist would approve of","is legally a sandwich","fits in a microwave","was invented after 1990","has been to space","is louder than a lawnmower",
  "a cat would knock off a table","you'd find in a museum gift shop","would get you kicked out of a library","rhymes with \"cheese\"","a medieval peasant would recognize",
  "is mentioned in at least one country song","you could carry up a ladder","would be weird to receive as a gift"];
function pick(a){return a[rnd(a.length)]}
function spellingConds(){
  return [
    pick(["has more than "+(4+rnd(4))+" letters","has fewer than "+(4+rnd(3))+" letters","has exactly "+(4+rnd(4))+" letters"]),
    pick(["ends with a vowel","ends with the letter "+pick("NRSTLY".split(""))]),
    pick(["contains the letter "+pick("AIOURSTK".split("")),"has no letter E in it"]),
    "has a double letter, like \"oo\" or \"ll\"",
    pick(["is one word","is two or more words"]),
    pick(["starts with a vowel","starts with a consonant"]),
    pick(["has an even number of letters","has an odd number of letters"]),
    pick(["has at least three vowels","has no letter A in it"]),
    "is spelled the same backwards",
    "has a letter that shows up three times",
    "contains a silent letter",
    pick(["has exactly two syllables","has more than three syllables"])
  ];
}
function pickCount(){ // mostly small, sometimes ridiculous, very occasionally a legal document
  var r=Math.random();
  if(r<.12)return 0;if(r<.30)return 1;if(r<.48)return 2;if(r<.62)return 3;if(r<.72)return 4;if(r<.79)return 5;if(r<.84)return 6;if(r<.88)return 7;
  if(r<.91)return 8+rnd(3);   // 8-10
  return 11+rnd(10);          // 11-20
}
function makePrompts(letter){
  var cats=shuffle(CATS.slice()).slice(0,ANS);
  var counts=cats.map(pickCount);
  counts[rnd(ANS)]=0;                                  // every round has at least one plain prompt
  if(Math.random()<.3){var j=rnd(ANS);if(counts[j]!==0||counts.filter(function(n){return !n}).length>1)counts[j]=10+rnd(11)} // the occasional monster (10-20)
  return cats.map(function(c,i){
    var n=Math.min(MAX_CONDS,counts[i]);
    if(!n){
      // A narrower kind ("a superhero movie") is still one plain category: no conditions.
      var subj=c.sub.length&&Math.random()<.55?pick(c.sub):c.a;
      return {cat:c.n,a:subj,plain:true,prep:"",conds:[]};
    }
    // A phrase after the noun ("a movie about a superhero") IS a condition.
    var prep=c.p.length&&Math.random()<.5?pick(c.p):"";
    var left=n-(prep?1:0),conds=[];
    if(left>0&&Math.random()<.75){conds.push("starts with the letter "+letter);left--}
    // small counts lean on category and spelling conditions; big counts pull in the silly ones too
    var core=shuffle(c.c.slice().concat(spellingConds())),silly=shuffle(VIBES.slice());
    var pool=left<=6?shuffle(core.slice(0,8).concat(silly.slice(0,3))):core.concat(silly);
    var seen={};conds.forEach(function(x){seen[x]=1});
    pool.forEach(function(x){if(left>0&&!seen[x]){seen[x]=1;conds.push(x);left--}});
    return {cat:c.n,a:c.a,plain:false,prep:prep,conds:conds};
  });
}
function condCount(p){return (p.conds||[]).length+(p.prep?1:0)}
function ruleText(p){
  var n=condCount(p);
  if(p.plain||!n)return "Anything that isn't "+p.a+".";
  return n===1?"Must be "+p.a+", but break the condition.":"Must be "+p.a+", but break all "+n+" conditions.";
}
function countLabel(n){
  if(!n)return "No conditions";
  if(n>=16)return n+" conditions. Seek help.";
  if(n>=11)return n+" conditions?!?!";
  if(n>=8)return n+" conditions?!";
  if(n>=5)return n+" conditions. Good luck.";
  return n+" condition"+(n>1?"s":"");
}
var TILTS=[-0.9,0.7,-0.5,1,-0.7];
function promptHTML(p,i,extra,cls,hideRule){ // hideRule: answering is on your own; the rule shows up later for the judges
  var n=condCount(p),conds=p.conds||[];
  return '<section class="sheet pcard '+(cls||"")+'" style="--tilt:'+TILTS[i%5]+'deg"><span class="pnum">'+(i+1)+'</span>'+
    '<div class="ptop"><span class="cat">'+esc(p.cat)+'</span><span class="ccount'+(n>=8?" monster":n?"":" zero")+'">'+esc(countLabel(n))+'</span></div>'+
    '<div class="ptext">Name '+esc(p.a)+(p.prep?' <mark>'+esc(p.prep)+'</mark>':'')+(conds.length?' that…':'.')+'</div>'+
    (conds.length?'<ul class="conds'+(conds.length>8?" many":"")+'">'+conds.map(function(c){return '<li>'+esc(c)+'</li>'}).join("")+'</ul>':'')+
    (hideRule?'':'<span class="rule '+(n?"cond":"plain")+'">'+esc(ruleText(p))+'</span>')+(extra||"")+'</section>';
}

  "Pigeon: Kevin (unpaid)","Glass breakage consultant: Gary's cousin","Lightning provided by Weather","Rain: also Weather",

/* letter roll + card deal */
function rollThenDeal(letter){
  var tile=$("#letter");L.dealing=true;L.rolling=true;
  var t0=Date.now(),iv=setInterval(function(){
    if(!tile.isConnected){clearInterval(iv);return}
    tile.textContent=pick(LETTERS);tile.classList.remove("empty");tile.classList.add("spin");
    if(Date.now()-t0>ROLL_MS){clearInterval(iv);tile.textContent=letter;tile.classList.remove("spin");tile.classList.add("land");L.rolling=false;sfx("thunk");
      setTimeout(function(){tile.classList.remove("land")},500);dealNext(0)}
    else sfx("tick");
  },70);
}
function dealNext(i){
  var cards=document.querySelectorAll(".pcard.deal");
  if(!cards.length){L.dealing=false;updateTimer();var f=$("#ans-0");if(f&&matchMedia("(pointer:fine)").matches)f.focus();return}
  cards[0].classList.remove("deal");cards[0].classList.add("dealt");sfx("thwip");
  if(cards.length===1){dealNext(i+1);return} // last card: start the clock right away
  setTimeout(function(){dealNext(i+1)},CARD_MS);
}

/* tiny synth sound effects (start only after a tap, as browsers require) */
var AC=null,soundOn=LS.get("wao_sound")!=="0";
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
document.addEventListener("pointerdown",unlockAudio);document.addEventListener("keydown",unlockAudio);
function blip(f,dur,type,vol,to,delay){
  var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol,f0,f1,type,delay){
  var t=AC.currentTime+(delay||0),n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
  var src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();src.buffer=b;f.type=type;
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+dur*.12);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f);f.connect(g);g.connect(AC.destination);src.start(t);src.stop(t+dur+.05);
}
var SFX={

  crash:function(){noise(1.1,.7,3500,90,"lowpass");blip(75,.6,"sine",.7,30);

  clank:function(){blip(420,.25,"square",.07,380);blip(1260,.35,"triangle",.06,1180,.01);noise(.12,.15,4000,1500,"highpass")},
  slap:function(){noise(.14,.45,2600,500,"highpass")},
  projector:function(){for(var i=0;i<10;i++)blip(1700,.02,"square",.02,0,i*.1);noise(1,.03,900,700,"bandpass")},
  studio:function(){[196,247,294,392].forEach(function(f,i){blip(f,1.2,"sawtooth",.03,f*1.01,i*.05)})},
  rain:function(){noise(8,.05,7000,3500,"highpass")},
  swell:function(){var d=2.2;[110,165,220,277,330].forEach(function(f){var t=AC.currentTime,o=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain();
    o.type="sawtooth";o.frequency.value=f;fl.type="lowpass";fl.frequency.setValueAtTime(200,t);fl.frequency.exponentialRampToValueAtTime(3500,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+d*.95);g.gain.exponentialRampToValueAtTime(.0001,t+d+.08);
    o.connect(fl);fl.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.1)})},
  heartbeat:function(){[0,.2,.7,.9].forEach(function(dl,i){blip(62,.18,"sine",i%2?.35:.5,40,dl)})},
  thunder:function(){noise(2.6,.55,500,40,"lowpass");noise(.25,.35,6000,1500,"highpass")},
  flutter:function(){for(var i=0;i<16;i++)noise(.05,.1,3000,1200,"bandpass",i*.045+Math.random()*.02)},

    o.type="sine";o.frequency.value=370;l.frequency.value=22;lg.gain.value=35;l.connect(lg);lg.connect(o.frequency);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+.26);
    o.connect(g);g.connect(AC.destination);o.start(t);l.start(t);o.stop(t+.28);l.stop(t+.28)})},
  kaching:function(){noise(.08,.2,5000,2000,"highpass");blip(2093,.12,"square",.05,0,.06);blip(2637,.55,"triangle",.1,0,.13)},
  choir:function(){[262,330,392,523].forEach(function(f,i){var t=AC.currentTime,o=AC.createOscillator(),v=AC.createOscillator(),vg=AC.createGain(),fl=AC.createBiquadFilter(),g=AC.createGain();
    o.type="sawtooth";o.frequency.value=f;v.frequency.value=5+i*.3;vg.gain.value=f*.012;v.connect(vg);vg.connect(o.frequency);
    fl.type="bandpass";fl.frequency.value=900;fl.Q.value=1.2;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.5);g.gain.exponentialRampToValueAtTime(.0001,t+2.8);
    o.connect(fl);fl.connect(g);g.connect(AC.destination);o.start(t);v.start(t);o.stop(t+2.9);v.stop(t+2.9)})},
  tick:function(){blip(1200,.03,"square",.03)},
  thwip:function(){blip(380,.13,"triangle",.16,1500)},

  bell:function(){[[1046,.35],[2093,.12],[2794,.08],[3520,.05]].forEach(function(h){blip(h[0],1.6,"sine",h[1])});blip(1046*1.004,1.6,"sine",.18)}, // SHAME. *ding*
  boing:function(){blip(180,.45,"sine",.25,520);blip(520,.3,"sine",.1,180,.18)},

};

/* =====================================================================
   THE STOP SIGN. The rest of the game was made for $3. This was not.
   Everything runs on "film time" A, which slows to 30% for the
   bullet-time approach. Film-time beats (ms):
     0      ratings card: THIS STOP HAS BEEN RATED W
     1100   studio logo; rain starts; drops collect on the lens
     1800   the sign spins in from the horizon; orchestra swells
     2700   bullet time (heartbeat)
     3200   IMPACT: lightning strike, flash, RGB split, cracked lens,
            shockwaves, debris, dust, a flock of pigeons
     3350   post clanks up · S-T-O-P stamps on · 4150 sticker
     4300   one pigeon comes back, lands on the sign, and stays
     4600   price tag drops in and swings
     4800+  specular glints with anamorphic lens flares
     4900+  product-launch spec callouts, one by one
   ===================================================================== */
var FILM={IMPACT:3200,SLOW0:2700,SLOWA:350,SLOWK:.3};
FILM.SLOWR=FILM.SLOWA/FILM.SLOWK;
function filmTime(t){if(t<FILM.SLOW0)return t;if(t<FILM.SLOW0+FILM.SLOWR)return FILM.SLOW0+(t-FILM.SLOW0)*FILM.SLOWK;return FILM.SLOW0+FILM.SLOWA+(t-FILM.SLOW0-FILM.SLOWR)}
function easeOutCubic(p){return 1-Math.pow(1-p,3)}
function easeInQuad(p){return p*p}
function easeOutBack(p){var c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)}
function clamp01(v){return v<0?0:v>1?1:v}
function octPath(g,r){g.beginPath();for(var k=0;k<8;k++){var a=Math.PI/8+k*Math.PI/4;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath()}
function seeded(seed){return function(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}}

function drawBolt(g,x,y,b,back){
  g.save();g.translate(x,y);
  g.beginPath();g.arc(b*.08,b*.12,b*1.45,0,7);g.fillStyle="rgba(0,0,0,.28)";g.fill();
  var w=g.createRadialGradient(-b*.4,-b*.5,b*.2,0,0,b*1.4);w.addColorStop(0,"#f4f6f8");w.addColorStop(.6,"#a7aeb6");w.addColorStop(1,"#5d646c");
  g.beginPath();g.arc(0,0,b*1.38,0,7);g.fillStyle=w;g.fill();
  g.beginPath();g.arc(0,0,b*1.38,0,7);g.lineWidth=b*.16;g.strokeStyle="rgba(130,62,18,.45)";g.stroke();

/* ---- keyboard-smash filter ---- */
var KB_ROWS=["qwertyuiop","asdfghjkl","zxcvbnm"];
function junkReason(t,forName){
  var s=String(t||"").toLowerCase(),al=s.replace(/[^a-z0-9]/g,"");
  if(!al)return "";                                            // blanks are handled elsewhere
  if(/(.)\1{3,}/.test(al))return "repeat";                     // ffffffff, aaaaah
  if(/^(.{1,3})\1{3,}.{0,3}$/.test(al))return "loop";          // lololol, 676767, hahahaha
  if(al.length>=7&&new Set(al.split("")).size/al.length<.3)return "loop";
  if(/(.{3,5})\1\1/.test(al))return "loop";                    // asdfasdfasdf
  for(var r=0;r<KB_ROWS.length;r++){var row=KB_ROWS[r],rev=row.split("").reverse().join("");
    for(var i=0;i+5<=row.length;i++)if(al.indexOf(row.substr(i,5))>=0||al.indexOf(rev.substr(i,5))>=0)return "mash"} // asdfg, poiuy
  var words=s.split(/[^a-z]+/).filter(Boolean);
  for(var w=0;w<words.length;w++){var wd=words[w];
    if(wd.length>=4)for(r=0;r<KB_ROWS.length;r++){var rw=KB_ROWS[r];if(rw.indexOf(wd)>=0||rw.split("").reverse().join("").indexOf(wd)>=0)return "mash"} // a whole word like "asdf"
    if(wd.length>=5&&!/[aeiouy]/.test(wd))return "mash";         // xkcdbvn
    if(/[bcdfghjklmnpqrstvwxz]{6,}/.test(wd))return "mash";       // dfghtklm
  }
  if(/\d{7,}/.test(al))return "numbers";
  if(forName&&/\d{4,}/.test(al))return "numbers";               // names: no long number tails
  return "";
}

function connectBroker(idx,h){
  var b=BROKERS[idx],up=false,failed=false,downTimer=null;
  var opts={clientId:"wao_"+Math.random().toString(36).slice(2,12),keepalive:20,connectTimeout:7000,reconnectPeriod:2000,clean:true,protocolVersion:4};

  function fail(){if(failed)return;failed=true;clearTimeout(downTimer);try{client.end(true)}catch(e){}h.onFail()}
  var firstTimer=setTimeout(function(){if(!up)fail()},8000);
  client.on("connect",function(){clearTimeout(firstTimer);clearTimeout(downTimer);downTimer=null;up=true;h.onUp(client)});
  client.on("message",function(topic,payload,packet){var d;try{d=JSON.parse(payload.toString())}catch(e){return}h.onMessage(topic,d,packet)});
  client.on("offline",function(){if(h.onDown)h.onDown();if(up&&!downTimer)downTimer=setTimeout(fail,15000)});
  client.on("error",function(){});
  return {client:client,close:function(){failed=true;clearTimeout(firstTimer);clearTimeout(downTimer);try{client.end(true)}catch(e){}}};
}

      var funny=voters.filter(function(v){return VT[v].funny&&VT[v].funny[i]===pid}).length;
      var out=voters.length>0&&rejects*2>voters.length;

  }

  var errs={};for(var eid in H.nameErr){if(now-H.nameErr[eid].at<10000)errs[eid]={why:H.nameErr[eid].why,nonce:H.nameErr[eid].nonce}}
  s.nameErr=errs;
  if(H.phase==="vote"){
    s.answers=H.prompts.map(function(p,i){return Object.keys(A).filter(function(pid){return realAnswer(A[pid][i])}).map(function(pid){return {pid:pid,text:A[pid][i].trim()}})});
    var sh=shameRound(H.game,H.round);
    s.junk=H.prompts.map(function(p,i){return sh.filter(function(x){return x.i===i}).map(function(x){return {key:x.key,text:x.text,why:x.why}})});
  }
  if(H.phase==="results"){var sr=scoreRound(H.game,H.round);s.results={rows:sr.rows.map(function(x){x.name=nameOf(x.pid);return x}),totals:sr.totals,
    shame:shameRound(H.game,H.round).map(function(x){return {i:x.i,text:x.text,why:x.why,count:x.count}})}} // no key, no pid: just the crime
  if(H.phase==="final"){
    var best=null;
    for(var k=1;k<=H.round;k++) scoreRound(H.game,k).rows.forEach(function(x){if(!x.out&&x.funny>0&&(!best||x.funny>best.funny))best={text:x.text,name:nameOf(x.pid),funny:x.funny,round:k}});
    s.best=best;
    var worst=null; // the Hall of Shame: the most-shamed smash of the game, still anonymous
    for(var k2=1;k2<=H.round;k2++) shameRound(H.game,k2).forEach(function(x){if(!worst||x.count>worst.count)worst={text:x.text,why:x.why,count:x.count,round:k2}});
    s.worst=worst;
  }
  return s;
}
function startRound(){
  var used=H.round>=1?H.usedLetters:[];
  var pool=LETTERS.filter(function(l){return used.indexOf(l)<0});if(!pool.length)pool=LETTERS;
  var letter=pool[rnd(pool.length)];
  H.round+=1;H.phase="answer";H.letter=letter;H.prompts=makePrompts(letter);H.usedLetters=used.concat(letter);
  H.deadline=Date.now()+H.secs*1000+DEAL_MS;H.stopAt=0;H.stoppedBy="";H.answers[rk()]={};H.votes[rk()]={};
}
function hostHandle(d){
  if(!H||!d||typeof d!=="object"||typeof d.id!=="string"||d.id.length>40)return;
  var id=d.id,p=H.players[id],now=Date.now(),mine=id===ME.id;
  if(d.t==="peek"){push();return} // someone connected and is picking a name: send them the room right away
  if(d.t==="hello"){
    var nm=cleanName(d.name),nonce=str(d.nonce,24),inRoom=p&&!p.left;
    if(!inRoom){ // joining (or coming back after leaving): the name must be usable and free
      var why=!nameKey(nm)?"empty":junkReason(nm,true)?"junk":nameTaken(nm,id)?"taken":"";
      if(why){H.nameErr[id]={why:why,nonce:nonce,at:now};push();return}
      delete H.nameErr[id];
      H.players[id]={name:nm,joined:p?p.joined:now,seen:now,left:false};push();return;
    }
    var changed=!isOn(id);p.seen=now;   // heartbeat from someone already here; names don't change mid-room
    if(changed||d.need)push();
    return;
  }
  if(!p)return;
  p.seen=now;
  if(d.t==="leave"){p.left=true;push();return}
  if(d.t==="ans"){
    if(d.game!==H.game||d.round!==H.round||(H.phase!=="answer"&&H.phase!=="stopping"))return;
    if(!Array.isArray(d.answers))return;
    (H.answers[rk()]=H.answers[rk()]||{})[id]=d.answers.slice(0,ANS).map(function(a){return str(a,80)});
    while(H.answers[rk()][id].length<ANS)H.answers[rk()][id].push("");
    push();return;
  }
  if(d.t==="stop"){
    if(d.game!==H.game||d.round!==H.round||H.phase!=="answer")return;
    var a=(H.answers[rk()]||{})[id]||[];
    if(a.filter(realAnswer).length<ANS)return; // smashes don't count toward a full card
    H.phase="stopping";H.stopAt=now;H.stoppedBy=id;push();return;
  }
  if(d.t==="vote"){
    if(d.game!==H.game||d.round!==H.round||H.phase!=="vote")return;
    var rej={},fun={},k;
    if(d.reject&&typeof d.reject==="object")for(k in d.reject){if(k.length<60&&d.reject[k]===true)rej[k]=true}
    if(d.funny&&typeof d.funny==="object")for(k in d.funny){if(/^[0-4]$/.test(k)&&typeof d.funny[k]==="string")fun[k]=d.funny[k].slice(0,40)}
    var shame={};if(d.shame&&typeof d.shame==="object")for(k in d.shame){if(/^j[a-z0-9]{1,24}$/.test(k)&&d.shame[k]===true)shame[k]=true}
    (H.votes[rk()]=H.votes[rk()]||{})[id]={reject:rej,funny:fun,shame:shame,done:!!d.done};
    push();return;
  }
  if(!mine)return; // everything below is the host's own controls
  if(d.t==="settings"){if([3,5,7].indexOf(d.rounds)>=0)H.rounds=d.rounds;if([60,90,120].indexOf(d.secs)>=0)H.secs=d.secs;push();return}
  if(d.t==="start"&&(H.phase==="lobby"||H.phase==="results")){startRound();push();return}
  if(d.t==="final"&&H.phase==="results"){H.phase="final";push();return}
  if(d.t==="again"&&H.phase==="final"){H.game+=1;H.round=0;H.phase="lobby";H.letter="";H.prompts=[];H.usedLetters=[];push();return}
  if(d.t==="reveal"&&H.phase==="vote"){H.phase="results";push();return}
}
function realAnswer(x){return !!(x&&x.trim()&&!junkReason(x))}
/* ---- the pillory: smashes are shown and shamed, but never tied to a person ---- */
function jkey(pid,g,r,i){return "j"+hash(H.salt+"|"+pid+"|"+g+"|"+r+"|"+i).toString(36)+hash(pid+H.salt+i).toString(36).slice(0,3)}
function shameRound(g,r){ // [{i,key,text,why,count}] for every smash this round, with no player attached
  var A=H.answers[g+"-"+r]||{},VT=H.votes[g+"-"+r]||{},out=[];
  Object.keys(A).forEach(function(pid){(A[pid]||[]).forEach(function(t,i){
    var why=t&&t.trim()?junkReason(t):"";if(!why)return;var k=jkey(pid,g,r,i);
    out.push({i:i,key:k,text:t.trim(),why:why,count:Object.keys(VT).filter(function(v){return VT[v].shame&&VT[v].shame[k]}).length});
  })});
  return out.sort(function(a,b){return a.key<b.key?-1:1});
}
/* names: "Ana", "ana" and "A.N.A." are the same name */
function nameKey(n){return cleanName(n).toLowerCase().replace(/[^a-z0-9]/g,"")}
function nameTaken(nm,exceptId){
  var k=nameKey(nm);
  return Object.keys(H.players).some(function(o){return o!==exceptId&&!H.players[o].left&&nameKey(H.players[o].name)===k});
}
function hostTick(){
  if(role!=="host"||!H)return;
  var now=Date.now();if(H.players[ME.id])H.players[ME.id].seen=now;
  if(H.phase==="answer"&&now>H.deadline){H.phase="stopping";H.stopAt=now;H.stoppedBy="time";push()}
  else if(H.phase==="stopping"&&now>H.stopAt+STOP_PAUSE){H.phase="vote";H.deadline=now+VOTE_SECS*1000;push()}
  else if(H.phase==="vote"&&(now>H.deadline||allVoted())){H.phase="results";push()}
}
function endRoom(){
  if(H){H.phase="closed";broadcast()}
  LS.del("wao_host");
  setTimeout(function(){closeConn();H=null;V=null;role=null;L.built="";render()},300);
}

/* ================= PLAYER ================= */
function pTopic(){return TOPIC+pCode}
function joinGame(code){
  role="player";pCode=code;V=null;L.built="";tries=0;L.joined=false;L.joining=false;L.nameErr="";
  try{sessionStorage.setItem("wao_inroom",code)}catch(e){} // a reload of this tab drops you straight back in
  pB=(bParam>=0&&bParam<BROKERS.length&&code===roomParam)?bParam:0;
  playerConnect(pB);render();
}
function sendIn(obj){
  var c=CONN&&CONN.client;
  if(c&&c.connected){try{c.publish(pTopic()+"/in",JSON.stringify(obj),{qos:0})}catch(e){}return true}
  return false;
}
function playerConnect(idx){
  closeConn();pB=idx;lastState=0;render();
  CONN=connectBroker(idx,{
    onUp:function(c){
      c.subscribe(pTopic()+"/state",{qos:0});connUp=true;
      if(L.joined)sendIn({t:"hello",id:ME.id,name:ME.name,need:true}); // reconnecting: say hi again
      else sendIn({t:"peek",id:ME.id});                                 // just looking: show me the room
      clearTimeout(findTimer);
      findTimer=setTimeout(function(){if(!lastState){tries++;playerConnect((idx+1)%BROKERS.length)}},6000);
      render();
    },
    onDown:function(){connUp=false;render()},
    onFail:function(){connUp=false;setTimeout(function(){if(role==="player")playerConnect((idx+1)%BROKERS.length)},500)},
    onMessage:function(topic,d,packet){
      if(packet&&packet.retain)return;
      if(topic!==pTopic()+"/state"||!d||d.t!=="state"||d.code!==pCode)return;
      if(typeof d.timeLeft==="number")d.deadlineLocal=Date.now()+d.timeLeft;
      V=d;lastState=Date.now();tries=0;
      var me=(d.players||[]).filter(function(p){return p.id===ME.id})[0];
      if(me){L.joined=true;L.joining=false;ME.name=me.name}                       // the host let us in (or we were already in)
      else if(L.joining&&d.nameErr&&d.nameErr[ME.id]&&d.nameErr[ME.id].nonce===L.nonce){L.joining=false;L.nameErr=d.nameErr[ME.id].why}
      render();
    }
  });
}
function leaveGame(){
  act({t:"leave"});
  try{sessionStorage.removeItem("wao_inroom")}catch(e){}
  setTimeout(function(){closeConn();role=null;V=null;L.built="";history.replaceState(null,"",location.pathname);roomParam="";render()},250);
}

/* ================= actions shared by host and players ================= */
function act(msg){
  msg.id=ME.id;
  if(role==="host"){hostHandle(msg);return true}
  return sendIn(msg);
}
function key(){return V.game+"-"+V.round}
function sendAnswers(){if(V&&L.myAns)act({t:"ans",game:V.game,round:V.round,answers:L.myAns.slice()})}
function sendVote(){if(V&&L.myVote)act({t:"vote",game:V.game,round:V.round,reject:L.myVote.reject,funny:L.myVote.funny,shame:L.myVote.shame||{},done:L.myVote.done})}

/* heartbeat */
var beat=0;
setInterval(function(){
  if(role==="host"){hostTick();return}
  if(role==="player"&&CONN){
    if(++beat%20===0&&L.joined) sendIn({t:"hello",id:ME.id,name:ME.name}); // every 5 s, once in the room
    if(L.joining&&beat%10===0) sendIn({t:"hello",id:ME.id,name:ME.name,nonce:L.nonce,need:true}); // resend a join that may have been lost
    if(lastState&&Date.now()-lastState>22000)playerConnect((pB+1)%BROKERS.length);
  }
},250);

  (L.myAns||[]).forEach(function(a,i){var n=normAns(a);if(!n)return;if(seen.hasOwnProperty(n)){out[i]=1;out[seen[n]]=1}else seen[n]=i});
  return Object.keys(out).map(Number);
}
function junkIdx(){var out=[];(L.myAns||[]).forEach(function(a,i){if(junkReason(a))out.push(i)});return out}
function markDupes(){ // repeats and keyboard smashes both get a red underline; smashes also get a note
  var d=dupIdx();

    var jr=junkReason(L.myAns&&L.myAns[i]),note=$("#note-"+i);

    var st="";
    if(s.phase==="answer"||s.phase==="stopping")st='<span class="st '+(p.filled===ANS?"done":"")+'">'+p.filled+'/'+ANS+'</span>';
    if(s.phase==="vote")st='<span class="st '+(p.voted?"done":"")+'">'+(p.voted?"voted":"voting")+'</span>';
    return '<li class="chip '+(p.id===ME.id?"me ":"")+(p.online?"":"off")+'"><span class="dot"></span>'+(p.id===s.host?'<span class="crown" title="Host">★</span>':'')+
      '<span class="nm">'+esc(p.name)+(p.id===ME.id?" (you)":"")+'</span><span class="sc">'+p.score+'</span>'+st+'</li>';
  }).join("");
}

function renderRoom(){
  var s=V,phase=s.phase,isHost=role==="host";
  if(L.built!=="room"){
    L.built="room";L.bodyKey="";
    $("#app").innerHTML=
      '<div class="topbar"><div class="left"><div class="letter" id="letter"></div>'+
      '<div><div class="meta" id="rmeta"></div><div class="roomcode" id="rcode"></div><div class="conn" id="conn"><span class="dot"></span><span id="connT"></span></div></div></div>'+
      '<div class="row"><button class="mini ghost" id="sndBtn" type="button" aria-pressed="'+soundOn+'">'+soundBtnLabel()+'</button><button class="mini ghost" id="copyBtn" type="button">Copy invite link</button><button class="mini ghost" id="leaveBtn" type="button"></button></div></div>'+
      '<ul class="players" id="players" aria-label="Players"></ul><main id="body"></main><div id="extra"></div>';
    $("#leaveBtn").onclick=function(){if(role==="host"){if(L.confirmEnd){endRoom()}else{L.confirmEnd=true;$("#leaveBtn").textContent="Tap again to end for everyone";setTimeout(function(){L.confirmEnd=false;var b=$("#leaveBtn");if(b)b.textContent="End room"},3000)}}else leaveGame()};
    $("#copyBtn").onclick=copyLink;
    $("#sndBtn").onclick=toggleSound;
  }
  $("#leaveBtn").textContent=L.confirmEnd?"Tap again to end for everyone":isHost?"End room":"Leave room";
  var Lt=$("#letter");if(!L.rolling){Lt.textContent=s.letter&&phase!=="lobby"?s.letter:"?";Lt.classList.toggle("empty",!s.letter||phase==="lobby")}
  $("#rmeta").textContent=phase==="lobby"?"Game "+s.game+" · Lobby":phase==="final"?"Game "+s.game+" · Final scores":"Game "+s.game+" · Round "+s.round+" of "+s.rounds;
  $("#rcode").textContent=s.code;
  var cn=$("#conn");cn.classList.toggle("off",!connUp);
  $("#connT").textContent=connUp?(isHost?"Room open":"Connected"):"Reconnecting…";
  $("#players").innerHTML=playersHTML();
  if(phase!=="answer")$("#dupPop").hidden=true;

  if(phase==="answer"||phase==="stopping"){
    if(L.bodyKey!=="ans-"+key()){L.bodyKey="ans-"+key();buildAnswer()}
    updateStop();
    if(phase==="stopping"&&L.flushed!==key()){L.flushed=key();clearTimeout(L.ansTimer);L.ansTimer=null;sendAnswers()}
  } else if(phase==="lobby"){
    if(L.bodyKey!=="lobby-"+s.game){L.bodyKey="lobby-"+s.game;buildLobby()}
    updateLobby();
  } else {
    var sig=phase+key()+JSON.stringify(phase==="vote"?[s.answers,s.junk]:phase==="results"?[s.results,s.players]:[s.best,s.worst,s.players]);
    if(L.bodySig!==sig){L.bodySig=sig;L.bodyKey=phase;if(phase==="vote")buildVote();else if(phase==="results")buildResults();else buildFinal()}
  }

  var ex=$("#extra");
  if(phase==="stopping"){
    if(ex.dataset.k!=="stop"){ex.dataset.k="stop";ex.innerHTML=""}
    // The trailer runs on this device's own clock and outlives the phase change, so a device
    // that heard about the STOP a beat late still gets the whole thing (voting loads underneath).
    if(L.cineKey!==key()){L.cineKey=key();if(!(s.stopAge>4000))playTrailer(s)}
  } else if(phase==="answer"||phase==="vote"){
    if(ex.dataset.k!==phase){
      ex.dataset.k=phase;
      ex.innerHTML='<div class="bar"><div class="in"><div class="timer"><span class="meta">'+(phase==="answer"?"Time left":"Voting time")+'</span><div class="track" id="track"><i id="fill"></i></div><span class="secs" id="secs"></span></div>'+
        (phase==="answer"?'<button class="stop oct" id="stopBtn" type="button" aria-label="Call stop">STOP</button>':'<button class="blue" id="doneBtn" type="button"></button>'+(isHost?'<button class="ghost mini" id="revealBtn" type="button">Reveal the carnage now</button>':''))+'</div></div>';
      if(phase==="answer"){$("#stopBtn").onclick=pressStop;updateStop()}
      else{$("#doneBtn").onclick=function(){L.myVote.done=!L.myVote.done;sendVote();render()};if(isHost)$("#revealBtn").onclick=function(){act({t:"reveal"})}}
    }
    if(phase==="vote"){var b=$("#doneBtn");if(b&&L.myVote)b.textContent=L.myVote.done?"Judged ✓ (tap to un-judge)":"I've judged enough"}
    updateTimer();
  } else {ex.innerHTML="";ex.dataset.k=""}
}
var CINE_MS=9600; // how long the trailer stays up on each device, from the moment that device starts it
function killCinema(){if(L.cineEl){L.cineEl.remove();L.cineEl=null}clearTimeout(L.cineT)}
function playTrailer(s){
  killCinema();
  var holder=document.createElement("div");
  holder.innerHTML='<div class="overlay cinema" role="alert"><canvas class="cine" aria-hidden="true"></canvas>'+
    '<div class="lb top"></div><div class="lb bot"><div class="roll"><span>'+CREDITS.map(esc).join(" &nbsp;·&nbsp; ")+'</span></div>'+
    '<button class="skip mute" type="button" aria-pressed="'+!soundOn+'">'+(soundOn?"Mute":"Unmute")+'</button><button class="skip" type="button">Skip ›</button></div>'+
    '<div class="cinecap"><div class="h">'+(s.stoppedBy?esc(s.stoppedBy)+" slammed the brakes!":"Time's up, slowpokes!")+'</div><div class="sub">'+esc(pick(STOP_SUBS))+'</div></div></div>';
  var el=holder.firstChild;document.body.appendChild(el);L.cineEl=el;
  var mute=el.querySelector(".mute");
  mute.onclick=function(){
    soundOn=!soundOn;LS.set("wao_sound",soundOn?"1":"0");unlockAudio();
    if(!soundOn&&currentScore){currentScore.stop();currentScore=null}
    mute.textContent=soundOn?"Mute":"Unmute";mute.setAttribute("aria-pressed",!soundOn);
    var sb=$("#sndBtn");if(sb){sb.textContent=soundBtnLabel();sb.setAttribute("aria-pressed",soundOn)}
  };
  var skipN=0,skip=el.querySelector(".skip:not(.mute)");
  skip.onclick=function(){skip.textContent=NO_SKIP[skipN++%NO_SKIP.length];sfx("boing")};
  stopCinematic(el);
  L.cineT=setTimeout(function(){el.classList.add("out");setTimeout(function(){el.remove();if(L.cineEl===el)L.cineEl=null},500)},CINE_MS);
}
function updateTimer(){
  var s=V,el=$("#secs");if(!s||!el||!s.deadlineLocal)return;
  var total=s.phase==="answer"?s.secs:VOTE_SECS,left=Math.max(0,Math.ceil((s.deadlineLocal-Date.now())/1000));
  if(s.phase==="answer"&&L.dealing){el.textContent="Dealing…";$("#fill").style.transform="scaleX(1)";return}
  left=Math.min(left,total);
  el.textContent=left+"s";$("#fill").style.transform="scaleX("+Math.min(1,left/total)+")";$("#track").classList.toggle("low",left<=10);
}
function copyLink(){
  var url=joinURL();
  if(!/^https?:/.test(url)){toast("Room code: "+V.code);return}
  try{navigator.clipboard.writeText(url).then(function(){toast("Invite link copied.")},function(){toast("Room code: "+V.code)})}catch(e){toast("Room code: "+V.code)}
}

function buildLobby(){
  var s=V,isHost=role==="host",url=joinURL(),online=/^https?:/.test(url);
  $("#body").innerHTML='<section class="sheet margin stack">'+
    '<h2>'+(s.game>1?"Back for more humiliation?":"Waiting for fellow wrong-doers")+'</h2>'+
    '<div class="share"><div class="qr" id="qr"'+(online?'':' hidden')+'></div><div class="stack" style="gap:6px">'+
      '<div class="meta">Room code</div><div class="bigcode">'+esc(s.code)+'</div>'+
      (online?'<div class="link">'+esc(url.replace(/^https?:\/\//,""))+'</div><p class="small muted">Friends scan the QR code, open the link, or open this page and type the code.</p>':
       '<p class="notice">This file is open from your computer, so other devices can\'t reach it. Put it on a free host (see the instructions that came with it), then open that web address instead.</p>')+
    '</div></div>'+
    (isHost?'<div class="row"><label for="lrounds">Rounds<select id="lrounds"><option>3</option><option>5</option><option>7</option></select></label>'+
      '<label for="lsecs">Time per round<select id="lsecs"><option value="60">60 sec</option><option value="90">90 sec</option><option value="120">120 sec</option></select></label></div>'+
      '<div class="row"><button class="primary" id="startBtn" type="button">Let the wrongness begin</button><span class="small muted" id="lobbyNote"></span></div>'
    :'<p class="muted" id="lobbyNote"></p>')+
  '</section>';
  if(online&&typeof QRCode!=="undefined"){try{new QRCode($("#qr"),{text:url,width:150,height:150,correctLevel:QRCode.CorrectLevel.M})}catch(e){$("#qr").hidden=true}}
  else $("#qr").hidden=true;
  if(isHost){
    $("#lrounds").onchange=function(e){act({t:"settings",rounds:+e.target.value,secs:V.secs})};
    $("#lsecs").onchange=function(e){act({t:"settings",rounds:V.rounds,secs:+e.target.value})};
    $("#startBtn").onclick=function(){act({t:"start"})};
  }
}
function updateLobby(){
  var s=V,n=s.players.length,note=$("#lobbyNote");
  if(role==="host"){
    if(document.activeElement!==$("#lrounds"))$("#lrounds").value=String(s.rounds);
    if(document.activeElement!==$("#lsecs"))$("#lsecs").value=String(s.secs);
    note.textContent=n<2?"You can play alone, but judging yourself is just sad. Invite people.":n+" players ready to be wrong.";
  } else {
    var host=s.players.filter(function(p){return p.id===s.host})[0];
    note.textContent="Waiting for "+(host?host.name:"the host")+" to start ("+s.rounds+" rounds, "+s.secs+" seconds each). Stretch your wrong muscles.";
  }
}

function buildAnswer(){
  var s=V,k=key();
  if(L.ansKey!==k){L.ansKey=k;var saved=null;try{saved=JSON.parse(sessionStorage.getItem("wao_a_"+s.code+"_"+k)||"null")}catch(e){}L.myAns=Array.isArray(saved)?saved:["","","","",""]}
  // Deal the cards one by one, but only at the real start of a round (late joiners and reloads see them all at once).
  var fresh=L.dealtKey!==k&&s.deadlineLocal&&(s.deadlineLocal-Date.now())>s.secs*1000&&!REDUCED;
  L.dealtKey=k;
  var holders=shuffle(PLACEHOLDERS.slice());
  $("#body").innerHTML='<div class="prompts">'+s.prompts.map(function(p,i){
    return promptHTML(p,i,'<input type="text" class="ansin" id="ans-'+i+'" maxlength="80" autocomplete="off" autocapitalize="off" placeholder="'+esc(holders[i])+'" value="'+esc(L.myAns[i])+'" aria-label="Answer '+(i+1)+'" aria-describedby="note-'+i+'"><div class="ansnote" id="note-'+i+'" aria-live="polite"></div>',fresh?"deal":"",true);
  }).join("")+'</div>';
  if(fresh)rollThenDeal(s.letter);
  markDupes();
  s.prompts.forEach(function(p,i){
    var el=$("#ans-"+i);
    el.addEventListener("input",function(e){
      L.myAns[i]=e.target.value.slice(0,80);
      try{sessionStorage.setItem("wao_a_"+V.code+"_"+L.ansKey,JSON.stringify(L.myAns))}catch(x){}
      clearTimeout(L.ansTimer);L.ansTimer=setTimeout(function(){L.ansTimer=null;sendAnswers()},600);
      markDupes();updateStop();
    });
    el.addEventListener("change",function(){checkDupOnLeave(i)});
    el.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();var nx=$("#ans-"+(i+1));if(nx)nx.focus();else pressStop()}});
  });
  if(L.myAns.some(function(a){return a}))sendAnswers();
}
function updateStop(){
  var b=$("#stopBtn"),answering=V.phase==="answer";
  document.querySelectorAll(".ansin").forEach(function(el){el.disabled=!answering});
  if(!b||!L.myAns)return;
  var filled=L.myAns.every(function(a){return a.trim()})&&answering;
  b.disabled=!filled;b.title=!filled?"Fill in all five answers first":junkIdx().length?"Some answers are keyboard smashes":dupIdx().length?"Some answers are repeats":"End the round for everyone";
}
function pressStop(){
  if(!L.myAns.every(function(a){return a.trim()})){toast("Nice try. Fill in all five before you slam STOP.");return}
  var jk=junkIdx();if(jk.length){toast("Answer "+(jk[0]+1)+" is a keyboard smash. Real (wrong) words only.");sfx("boing");var je=$("#ans-"+jk[0]);if(je){je.focus();je.select()}return}
  var d=dupIdx();if(d.length){L.dupShownFor="";showDupPop(d[d.length-1]);return}
  clearTimeout(L.ansTimer);L.ansTimer=null;sendAnswers();
  act({t:"stop",game:V.game,round:V.round});
}

function buildVote(){
  var s=V,k=key();
  if(L.voteKey!==k){L.voteKey=k;L.myVote={reject:{},funny:{},shame:{},done:false}}
  var html=s.prompts.map(function(p,i){
    var list=(s.answers[i]||[]).slice().sort(function(a,b){return hash(a.pid+k+i)-hash(b.pid+k+i)});
    var items=list.map(function(a){
      var mine=a.pid===ME.id,kk=a.pid+"|"+i,bad=!!L.myVote.reject[kk],star=L.myVote.funny[i]===a.pid;
      return '<li><div><div class="atext">'+esc(a.text)+'</div>'+(mine?'<div class="who">your answer</div>':'')+'</div>'+
        (mine?'':'<div class="vctl"><button type="button" class="tog '+(bad?"bad":"okay")+'" data-rej="'+esc(kk)+'" aria-pressed="'+bad+'">'+(bad?"✗ Busted":"✓ Legit wrong")+'</button>'+
        '<button type="button" class="tog star" data-star="'+i+'" data-pid="'+esc(a.pid)+'" aria-pressed="'+star+'">★ Funniest</button></div>')+'</li>';
    }).join("");
    var junk=(s.junk&&s.junk[i])||[];
    var pill=junk.length?'<div class="pillory"><div class="pillhead">Publicly shamed</div><ul class="vlist">'+junk.map(function(j){
      var on=!!L.myVote.shame[j.key],mine=L.myAns&&normAns(L.myAns[i])===normAns(j.text)&&L.ansKey===k;
      return '<li class="shamed"><div><div class="atext">'+esc(j.text)+'</div><div class="who">Crime: '+esc(CRIMES[j.why]||"keyboard smash")+(mine?' · this one\'s yours (only you can see that)':'')+'</div></div>'+
        '<div class="vctl"><button type="button" class="tog bell" data-shame="'+esc(j.key)+'" aria-pressed="'+on+'">🔔 '+(on?"Shamed!":"Shame")+'</button></div></li>';
    }).join("")+'</ul></div>':'';
    return promptHTML(p,i,(items?'<ul class="vlist">'+items+'</ul>':'<p class="empty">Nobody answered this one. Cowards.</p>')+pill);
  }).join("");
  var anyJunk=(s.junk||[]).some(function(l){return l&&l.length});
  $("#body").innerHTML='<div class="stack"><section class="sheet pad"><h2>Judge your friends. Harshly.</h2><p class="muted">Bust anyone who didn\'t follow the rule, and crown the funniest answer on each prompt. Names stay secret until the scores drop, so no revenge voting. Probably.</p>'+
    (anyJunk?'<p class="small" style="margin-top:6px"><b>Keyboard smashes</b> can\'t score, but they don\'t get off that easy. Ring the bell to shame them. Nobody will ever know who typed them. Not even the scoreboard.</p>':'')+
    '</section><div class="prompts">'+html+'</div></div>';
  function changed(){sfx("pop");clearTimeout(L.voteTimer);L.voteTimer=setTimeout(sendVote,300);buildVote()}
  $("#body").querySelectorAll("[data-rej]").forEach(function(b){b.onclick=function(){var x=b.dataset.rej;if(L.myVote.reject[x])delete L.myVote.reject[x];else L.myVote.reject[x]=true;changed()}});
  $("#body").querySelectorAll("[data-shame]").forEach(function(b){b.onclick=function(){var x=b.dataset.shame;
    if(L.myVote.shame[x])delete L.myVote.shame[x];else{L.myVote.shame[x]=true;sfx("bell")}
    clearTimeout(L.voteTimer);L.voteTimer=setTimeout(sendVote,300);buildVote()}});
  $("#body").querySelectorAll("[data-star]").forEach(function(b){b.onclick=function(){var i=b.dataset.star;if(L.myVote.funny[i]===b.dataset.pid)delete L.myVote.funny[i];else L.myVote.funny[i]=b.dataset.pid;changed()}});
}

function boardHTML(){
  var ps=V.players.slice().sort(function(a,b){return b.score-a.score}),place=0,prev=null;
  return '<ol class="board">'+ps.map(function(p,i){if(p.score!==prev){place=i+1;prev=p.score}return '<li class="'+(place===1?"first":"")+'"><span class="place">'+place+'</span><span class="nm">'+esc(p.name)+(p.id===ME.id?" (you)":"")+'</span><span class="sc">'+p.score+'</span></li>'}).join("")+'</ol>';
}
function shameLine(n){return n?("🔔 Shamed by "+n+(n===1?" person":" people")):"Somehow escaped shame"}
function shameHTML(list,i,delay){ // smashes in results: the crime and the verdict, never the person
  var mine=(list||[]).filter(function(x){return x.i===i}).sort(function(a,b){return b.count-a.count});
  if(!mine.length)return "";
  return '<div class="pillory"><div class="pillhead">Publicly shamed</div><ul class="vlist">'+mine.map(function(x){
    return '<li class="shamed"><div><div class="atext">'+esc(x.text)+'</div><div class="who">Author: unknown · Crime: '+esc(CRIMES[x.why]||"keyboard smash")+'</div></div>'+
      '<div class="vctl"><span class="stamp shame" style="--d:'+delay+'ms">'+(x.count?"SHAMED ×"+x.count:"UNSHAMED")+'</span><span class="pts">+0</span></div></li>';
  }).join("")+'</ul></div>';
}
function buildResults(){
  var s=V,R=s.results||{rows:[],totals:{}},isHost=role==="host",last=s.round>=s.rounds;
  var fresh=L.animKey!=="res"+key();L.animKey="res"+key();var d=0;
  function dl0(){return (d++)*110}
  var sec=s.prompts.map(function(p,i){
    var pr=R.rows.filter(function(x){return x.i===i}).sort(function(a,b){return b.pts-a.pts});
    return promptHTML(p,i,
      (pr.length?'<ul class="vlist">'+pr.map(function(x){var dl='style="--d:'+((d++)*110)+'ms"';return '<li><div><div class="atext '+(x.out?"out":"")+'">'+esc(x.text)+'</div><div class="who">'+esc(x.name)+(x.funny?" · "+x.funny+" funny vote"+(x.funny>1?"s":""):"")+'</div></div>'+
        '<div class="vctl">'+(x.top?'<span class="stamp top" '+dl+'>COMEDY GOLD</span>':'')+(x.out?'<span class="stamp out" '+dl+'>BUSTED</span>':'<span class="stamp ok" '+dl+'>'+OK_STAMPS[hash(x.pid+x.i+key())%OK_STAMPS.length]+'</span>')+'<span class="pts">+'+x.pts+'</span></div></li>'}).join("")+'</ul>':'<p class="empty">No answers. Suspicious.</p>')+shameHTML(R.shame,i,dl0()),
      fresh?"stamping":"");
  }).join("");
  if(fresh){sfx("ding");setTimeout(function(){sfx("thunk")},350)}
  var host=s.players.filter(function(p){return p.id===s.host})[0];
  $("#body").innerHTML='<div class="split"><div class="prompts" style="grid-template-columns:1fr">'+sec+'</div>'+
    '<aside class="sheet pad stack"><h2>Round '+s.round+' points</h2><ol class="board">'+s.players.slice().sort(function(a,b){return (R.totals[b.id]||0)-(R.totals[a.id]||0)}).map(function(p){return '<li><span class="place">+</span><span class="nm">'+esc(p.name)+'</span><span class="sc">'+(R.totals[p.id]||0)+'</span></li>'}).join("")+'</ol>'+
    '<h2>Game so far</h2>'+boardHTML()+
    (isHost?'<button class="primary" id="nextBtn" type="button">'+(last?"Crown the wrongest":"Deal me in again")+'</button>':'<p class="muted small">Waiting for '+esc(host?host.name:"the host")+' to continue. Gloat or sulk accordingly.</p>')+
    '</aside></div>';
  if(isHost)$("#nextBtn").onclick=function(){act({t:last?"final":"start"})};
}
function buildFinal(){
  var s=V,isHost=role==="host",b=s.best,host=s.players.filter(function(p){return p.id===s.host})[0];
  var top=s.players.slice().sort(function(a,c){return c.score-a.score}),champs=top.filter(function(p){return p.score===(top[0]&&top[0].score)});
  var crown=!champs.length?"":champs.length>1?'<div class="winner">'+champs.map(function(p){return esc(p.name)}).join(" &amp; ")+'<br><b>are equally, gloriously wrong</b></div>':
    '<div class="winner">'+esc(champs[0].name)+'<br><b>is the wrongest person here</b></div>';
  $("#body").innerHTML='<div class="split"><section class="sheet margin stack"><h2>Hall of Wrongness</h2>'+crown+boardHTML()+
    '<div class="row">'+(isHost?'<button class="primary" id="againBtn" type="button">Run it back</button>':'<span class="muted small">'+esc(host?host.name:"The host")+' can start another game.</span>')+'</div></section>'+
    '<section class="sheet pad stack"><h2>Funniest answer of the game</h2>'+
    (b?'<div class="best"><div class="atext">'+esc(b.text)+'</div><div class="who">'+esc(b.name)+' · round '+b.round+' · '+b.funny+' funny vote'+(b.funny>1?"s":"")+'</div></div>':'<p class="empty">No funny votes this game. Tough crowd.</p>')+
    (s.worst?'<h2>Hall of Shame</h2><div class="pillory hall"><div class="atext">'+esc(s.worst.text)+'</div>'+
      '<div class="who">Round '+s.worst.round+' · Crime: '+esc(CRIMES[s.worst.why]||"keyboard smash")+' · '+esc(shameLine(s.worst.count))+'</div>'+
      '<div class="who">Author: unknown, and we\'d like to keep it that way.</div></div>':'')+
    '</section></div>';
  if(L.animKey!=="final"+s.game){L.animKey="final"+s.game;sfx("fanfare");confetti()}
  if(isHost)$("#againBtn").onclick=function(){act({t:"again"})};
}

if(document.fonts&&document.fonts.load)document.fonts.load("700 40px Oswald").catch(function(){}); // the stop sign's lettering
/* resume or auto-join */
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&role==="player"&&lastState&&Date.now()-lastState>8000)playerConnect(pB)});
render();
(function(){var back=null;try{back=sessionStorage.getItem("wao_inroom")}catch(e){}if(back&&typeof mqtt!=="undefined")joinGame(cleanCode(back))})();
})();
</script>
